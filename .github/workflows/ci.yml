name: CI

on:
  pull_request:
  push:
    branches: [main, staging, development]

# Cancela execuções antigas do mesmo branch/PR quando há novo push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lê a versão do pnpm do campo packageManager do package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check-types

      - name: Lint
        run: pnpm lint

      # Drift de tradução (chaves/placeholders fora de sync com pt-BR) quebra o CI.
      - name: Check locales
        run: pnpm check-locales

      - name: Build
        run: pnpm build

  # Gate de testes do backend (unit + e2e). Roda em paralelo ao `verify` e é um
  # status check independente. e2e sobem o AppModule real contra o Supabase local.
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DATABASE_APP_URL: postgresql://app_user:app_user_dev@127.0.0.1:54322/postgres
      NOTIFICATIONS_EMAIL_ENABLED: "false"
      # Valor fixo de CI: os e2e de scheduled-transactions precisam de um tick
      # bem-sucedido; o teste envia este mesmo secret e o CronSecretGuard compara.
      CRON_SECRET: ci-cron-secret
      NODE_ENV: test
      # Usado para montar as success/cancel/return URLs do Stripe Checkout e
      # Billing Portal (CreateCheckoutSessionUseCase/CreatePortalSessionUseCase).
      FRONTEND_URL: http://localhost:3000
      # Stripe test mode (M14, ADR-0026) — os e2e de subscriptions chamam a
      # API real do Stripe (checkout/portal); secret do repositório. O price
      # a usar vem do catálogo local (PlanCatalogService sincroniza com o
      # Stripe no boot via lookup_key) — não precisa de env var de price id.
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      # Valor fixo de CI — os e2e do webhook (B-3) assinam o payload com este
      # mesmo secret (generateTestHeaderString), então não vem do dashboard.
      STRIPE_WEBHOOK_SECRET: whsec_test_ci_larmony_b3
      # Import de extrato (ADR-0034) — sem isso os e2e de statement-import
      # (flow/rls/cron) recebem 503 STATEMENT_IMPORT_DISABLED antes mesmo de
      # criar o job. PROCESSOR_SHARED_SECRET é lido tanto pelo teste quanto
      # pelo ProcessorSecretGuard (mesmo processo) — qualquer valor não-vazio
      # serve, só precisam bater. STATEMENT_PROCESSOR_URL fica
      # deliberadamente ausente: o handshake síncrono do HttpStatementProcessor
      # real (não mockado nos e2e de rls/cron) precisa falhar graciosamente
      # (job nasce "failed" via markFailedSync) — ver comentário no topo de
      # test/statement-import-rls.e2e-spec.ts.
      STATEMENT_IMPORT_ENABLED: "true"
      PROCESSOR_SHARED_SECRET: ci-processor-secret
      BACKEND_PUBLIC_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Unit primeiro: sem banco, falha rápido e barato.
      - name: Unit tests (backend)
        run: pnpm --filter backend test

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      - name: Export Supabase env
        run: |
          supabase status -o env > supabase.env
          echo "SUPABASE_URL=$(grep '^API_URL=' supabase.env | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$(grep '^ANON_KEY=' supabase.env | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(grep '^SERVICE_ROLE_KEY=' supabase.env | cut -d= -f2- | tr -d '\"')" >> "$GITHUB_ENV"

      - name: Run migrations
        run: pnpm --filter backend db:migrate

      # e2e: serial (--runInBand no script), compartilham o banco.
      - name: E2E tests (backend)
        run: pnpm --filter backend test:e2e
