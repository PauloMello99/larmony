[project]
name = "statement-processor"
version = "0.1.0"
description = "Serviço de processamento de extratos (CSV/OFX/PDF) do Larmony — computação sem estado, nunca acessa Postgres/RLS (ADR-0033)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "httpx>=0.27",
  # Fase 3 (OCR de PDF). Confirmado por instalação real: o pacote base
  # `docling` (2.121.0) traz RapidOCR como dependência, mas NÃO EasyOCR —
  # `EasyOcrOptions()` falha em runtime com ImportError sem o pacote
  # `easyocr` explícito (motor escolhido: EasyOCR, decisão confirmada com
  # o usuário, apesar do RapidOCR ser o mais leve). Versão travada no minor
  # validado: o Dockerfile assume fatos específicos desta versão (conjunto
  # default de `docling-tools models download`, nome da pasta "EasyOcr/"
  # em artifacts_path) que podem mudar silenciosamente em um minor futuro.
  "docling~=2.121.0",
  "easyocr~=1.7.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-httpx>=0.35",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow: exercita OCR real (Docling+EasyOCR), 1-4min — nao roda por default"]
addopts = "-m 'not slow'"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
